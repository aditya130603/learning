name: Android APK - universal Android 5+
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'mission-content.js'
      - 'scene-art.js'
      - 'lexicon-data.js'
      - 'word-studio.js'
      - 'friend-challenge.js'
      - 'v3.css'
      - 'v5.css'
      - 'adult-v5.js'
      - 'adult-100-data.js'
      - 'adult-roadmap-v8.js'
      - 'guided-v8.js'
      - 'adult-placement-v13.js'
      - 'live-kids-v13.js'
      - 'learning-v13.css'
      - 'kids-journey-v10.js'
      - 'kids-journey-v10.css'
      - 'word-facts-v9.js'
      - 'ux-v9.js'
      - 'ux-v9.css'
      - 'tests/**'
      - 'progression-v8.css'
      - 'grammar-core.js'
      - 'grammar-model.js'
      - 'grammar-context.js'
      - 'grammar-context.bin'
      - 'grammar-data/**'
      - 'training/**'
      - 'kids-v5.js'
      - 'kids-polish-v6.js'
      - 'mission-expansion-v6.js'
      - 'scene-pack-v6.js'
      - 'lexicon-v6.js'
      - 'lexicon-v6.css'
      - 'dictionary-study-v7.js'
      - 'dictionary-study-v7.css'
      - 'dictionary-lessons/**'
      - 'scripts/**'
      - 'dictionary/**'
      - 'assets/v8-scenes/**'
      - 'mayhem.js'
      - 'words.js'
      - 'styles.css'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Train (or verify) full offline 24 MiB context model from attributed text
        run: |
          if [ -f grammar-context.bin ]; then
            test "$(wc -c < grammar-context.bin)" -eq 25165824
            echo 'Existing verified-size model reused.'
          else
            python3 training/build_context_model.py --output grammar-context.bin --report training/CONTEXT_REPORT.json
          fi
          test "$(wc -c < grammar-context.bin)" -eq 25165824
      - name: Build attributed offline dictionary (OEWN 2025)
        run: python3 scripts/build_wordnet.py --output dictionary
      - name: Create source-grounded practice for every installed dictionary sense
        run: |
          python3 scripts/enrich_wordnet.py --dictionary dictionary --output dictionary-lessons
          python3 tests/test_enrichment.py
          python3 -c "import json; d=json.load(open('dictionary/meta.json')); r=json.load(open('dictionary-lessons/report.json')); assert r['counts']['terms']==d['entry_count'] and d['entry_count']>=100000, (d['entry_count'],r['counts']['terms']); print('Practice coverage verified:',r['counts']['terms'])"
      - name: Validate six adult 100-level curricula
        run: python3 scripts/validate_tracks_v8.py --dictionary dictionary --output training/V8_COVERAGE_REPORT.json
      - name: Check learning logic
        run: node --test tests/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline website and launcher icon
        run: |
          mkdir -p android/app/src/main/assets/assets android/app/src/main/res/drawable-nodpi
          cp index.html app.js words.js mission-content.js mayhem.js adult-placement-v13.js live-kids-v13.js learning-v13.css dictionary-study-v7.js dictionary-study-v7.css scene-art.js lexicon-data.js word-studio.js friend-challenge.js grammar-model.js grammar-context.js grammar-context.bin grammar-core.js adult-v5.js kids-v5.js kids-polish-v6.js guided-v8.js kids-journey-v10.js kids-journey-v10.css word-facts-v9.js ux-v9.js ux-v9.css adult-100-data.js adult-roadmap-v8.js progression-v8.css mission-expansion-v6.js scene-pack-v6.js lexicon-v6.js lexicon-v6.css styles.css v3.css v5.css service-worker.js manifest.webmanifest android/app/src/main/assets/
          cp -R assets/. android/app/src/main/assets/assets/
          mkdir -p android/app/src/main/assets/dictionary
          cp -R dictionary/. android/app/src/main/assets/dictionary/
          mkdir -p android/app/src/main/assets/dictionary-lessons
          cp -R dictionary-lessons/. android/app/src/main/assets/dictionary-lessons/
          cp assets/icon-192.png android/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build universal debug APK (Android API 21+)
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk little-letters-android5-plus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Little-Letters-Android-5-plus
          path: little-letters-android5-plus.apk
          retention-days: 90
      - name: Publish model as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrammarCore-Trained-Model-24MiB
          path: |
            grammar-context.bin
            training/CONTEXT_REPORT.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit trained data to repository for PWA offline use
        if: ${{ !cancelled() && success() }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add grammar-context.bin training/CONTEXT_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish trained 24 MiB grammar context counts'
            git push origin HEAD:main
          fi
      - name: Publish latest testing APK on Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-testing >/dev/null 2>&1; then
            gh release upload android-testing little-letters-android5-plus.apk --clobber
          else
            gh release create android-testing little-letters-android5-plus.apk --target "$GITHUB_SHA" --title 'Little Letters - Android testing APK' --notes 'Universal debug-signed testing APK, Android 5.0 or later. No Flutter, no emulator, no third-party runtime dependencies. Lessons are offline.' --prerelease
          fi
