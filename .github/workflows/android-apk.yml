name: Little Learners 4-6 - APK and UI checks
on:
  push:
    branches: [main, 'feat/little-learners-age-4-6-rebuild']
    paths:
      - 'android/**'
      - 'little-46*'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'assets/icon*'
      - 'assets/kids46/**'
      - 'assets/scenes/little-garden.svg'
      - 'tests/little-46.test.js'
      - 'scripts/package-little-46.sh'
      - 'scripts/check-little-46-ui.cjs'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: little-learners-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the 4-6 curriculum and unlock rules
        run: node --test tests/little-46.test.js
      - name: Package tiny offline site
        run: bash scripts/package-little-46.sh dist
      - name: Save offline site for independent review
        uses: actions/upload-artifact@v4
        with:
          name: little-learners-offline-site
          path: dist/
          retention-days: 30
      - name: Check actual mobile UI in headless Chrome (NO emulator)
        run: |
          npm install --prefix /tmp/little-ui --no-save playwright@1.51.1
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'Chrome not installed on runner'; exit 1; fi
          NODE_PATH=/tmp/little-ui/node_modules UI_BROWSER="$CHROME" node scripts/check-little-46-ui.cjs
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-learners-4-6-screen-checks
          path: /tmp/little-learners-ui
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle only little-learner assets
        run: |
          bash scripts/package-little-46.sh android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/icon-192.png android/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build one universal Android 5+ APK
        run: |
          if gradle -p android :app:assembleStandardDebug --no-daemon --console=plain > /tmp/little-build.log 2>&1; then
            tail -30 /tmp/little-build.log
          else
            tail -160 /tmp/little-build.log
            exit 1
          fi
          cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk little-learners-age-4-6.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-learners-age-4-6-android5-plus
          path: little-learners-age-4-6.apk
          retention-days: 90
      - name: Publish testing Release only after main branch merges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view little-learners-46 >/dev/null 2>&1; then
            gh release upload little-learners-46 little-learners-age-4-6.apk --clobber
          else
            gh release create little-learners-46 little-learners-age-4-6.apk --target "$GITHUB_SHA" --title 'Little Learners 4–6 — Android testing APK' --notes 'Offline-first universal Android 5+ APK. Debug signed for sideload testing. Only the 4–6 learning experience; no adult dictionary or 24 MB grammar model.' --prerelease
          fi
