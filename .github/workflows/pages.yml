name: Publish Little Letters
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Build offline licensed WordNet search data
        run: python3 scripts/build_wordnet.py --output dictionary
      - name: Create source-grounded practice for every installed dictionary sense
        run: |
          python3 scripts/enrich_wordnet.py --dictionary dictionary --output dictionary-lessons
          python3 tests/test_enrichment.py
          python3 -c "import json; d=json.load(open('dictionary/meta.json')); r=json.load(open('dictionary-lessons/report.json')); assert r['counts']['terms']==d['entry_count'] and d['entry_count']>=100000, (d['entry_count'],r['counts']['terms']); print('Practice coverage verified:',r['counts']['terms'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
