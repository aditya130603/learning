plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.littleletters.learn'
    compileSdk 35
    defaultConfig {
        applicationId 'com.littleletters.learn'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '1.3.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'engine'
    productFlavors {
        standard { dimension 'engine'; buildConfigField 'boolean', 'OFFLINE_COACH', 'false' }
        offline {
            dimension 'engine'
            minSdk 31
            ndk { abiFilters 'arm64-v8a' }
            buildConfigField 'boolean', 'OFFLINE_COACH', 'true'
        }
    }
    kotlinOptions { jvmTarget = '1.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { offlineImplementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.1' }
